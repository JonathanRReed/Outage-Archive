name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci

      - name: Check lint and formatting
        run: npm run check

      - name: Test image pipeline and maintenance contracts
        run: npm test

      - name: Test Markdown, MDX, slots and props
        run: npm run test:rendering

      - name: Build production site
        run: npm run build

      - name: Verify production routes and metadata
        run: npm run test:production

      - name: Build and test component library
        run: npm run test:library

      - name: Audit complete dependency tree
        run: npm audit

      - name: Audit production dependency tree
        run: npm audit --omit=dev
